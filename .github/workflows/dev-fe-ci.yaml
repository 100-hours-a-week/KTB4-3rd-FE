name: FE CI

on:
  # PR 은 검증만 수행하고 ECR push 와 배포는 하지 않는다.
  # hotfix/* 는 main 으로 PR 을 보내므로 아래 main 대상 PR 에 포함된다.
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'

  # develop, release/* 로의 직접 push 는 branch protection 으로 차단되므로
  # 이 이벤트는 사실상 "PR 이 병합되어 ref 가 전진했을 때"의 push 를 의미한다.
  push:
    branches:
      - develop
      - 'release/**'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  IMAGE_NAME: moyeota-fe
  NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
  NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
  NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
  NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
  NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Chromatic 의 baseline 비교를 위해 전체 히스토리가 필요하다.
          fetch-depth: 0

      # v6 는 부트스트랩 pnpm 을 설치한 뒤 self-update 로 타깃 버전에 맞추는데,
      # 그 과정이 self-installer 단계에서 실패해 v4 를 사용한다.
      # v4 는 요청한 버전을 그대로 설치한다.
      # version 값은 package.json 의 packageManager 와 반드시 일치해야 한다.
      # 두 값이 어긋나면 action 이 "Multiple versions of pnpm specified" 로 실패한다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 빠르고 싼 검증부터 실행해 피드백 시간을 줄인다.
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit test
        run: pnpm test

      - name: Run Chromatic
        if: github.event_name == 'push'
        run: pnpm run chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      # next build 는 아래 Docker 빌드에서 수행되므로 별도 build 스텝을 두지 않는다.
      #
      # FE CI 의 책임은 dev-/rc- 이미지 생성까지다.
      # 정식 출시 태그(prod-vX.Y.Z-<sha7>)는 "재빌드 없이 동일 Digest" 정책에 따라
      # Cloud(CD) 레포에서 생성한다. CD 는 rc-vX.Y.Z- prefix 로 ECR 을 조회해
      # 해당 버전의 rc 이미지를 찾은 뒤 prod- 태그로 재태깅한다.
      - name: Resolve image tag
        id: meta
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_REF_NAME" == develop ]]; then
            image_tag="dev-${GITHUB_SHA:0:7}"
            release_version=""
            push_image=true
          elif [[ "$GITHUB_REF_NAME" == release/* ]]; then
            version="${GITHUB_REF_NAME#release/}"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            image_tag="rc-${version}-${GITHUB_SHA:0:7}"
            release_version="$version"
            push_image=true
          elif [[ "$GITHUB_REF_NAME" == hotfix/* ]]; then
            image_tag="hf-${GITHUB_SHA:0:7}"
            release_version=""
            push_image=false
          else
            image_tag="pr-${GITHUB_SHA:0:7}"
            release_version=""
            push_image=false
          fi

          {
            echo "image_tag=$image_tag"
            echo "release_version=$release_version"
            echo "push_image=$push_image"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          set -Eeuo pipefail

          docker_build_args=()
          if [[ -n "${SENTRY_AUTH_TOKEN:-}" ]]; then
            docker_build_args+=(--secret "id=sentry_auth_token,env=SENTRY_AUTH_TOKEN")
          fi

          DOCKER_BUILDKIT=1 docker build \
            --file Dockerfile \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --build-arg "BUILD_SHA=${GITHUB_SHA}" \
            --build-arg "RELEASE_VERSION=${{ steps.meta.outputs.release_version }}" \
            --build-arg "BUILD_DATE=${{ steps.meta.outputs.build_date }}" \
            --build-arg "SENTRY_ORG=${SENTRY_ORG:-}" \
            --build-arg "SENTRY_PROJECT=${SENTRY_PROJECT:-}" \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}" \
            --build-arg "NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-}" \
            --build-arg "NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}" \
            --build-arg "NEXT_PUBLIC_SENTRY_ENVIRONMENT=${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-}" \
            --build-arg "NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-}" \
            "${docker_build_args[@]}" \
            .
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        shell: bash

      - name: Configure AWS credentials
        if: steps.meta.outputs.push_image == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: fe-ci-${{ github.run_id }}

      - name: Login to ECR
        if: steps.meta.outputs.push_image == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        if: steps.meta.outputs.push_image == 'true'
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -Eeuo pipefail

          remote_image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "$remote_image"
          docker push "$remote_image"
