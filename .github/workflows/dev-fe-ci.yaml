name: FE CI

on:
  # PR은 검증만 수행하고 ECR push와 배포는 하지 않는다.
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'

  # develop은 Dev 이미지, release/vX.Y.Z는 Stg 이미지(rc-*), hotfix/vX.Y.Z는 Prod 긴급 수정 이미지(hf-*) 생성 대상이고,
  # main은 Prod CD의 검증 대상이다.
  # main에서는 이미지를 다시 빌드해 배포하지 않고, Stg에서 검증한
  # 이미지 Digest를 Prod CD가 승격한다.
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  IMAGE_NAME: moyeota-fe
  # 빌드 시 번들에 들어가는 NEXT_PUBLIC_* 는 GitHub vars가 아니라 SSM Parameter Store에서 읽는다.
  #   경로: /moyeota/v2/build/frontend/<KEY>  (CLOUD 레포 v2/ssm.tf, issues/ecs-ssm-env-management.md)
  #   스테이지가 없는 이유: 같은 digest를 Stg → Prod로 승격하므로 빌드 값은 하나뿐이다.
  SSM_BUILD_PREFIX: /moyeota/v2/build/frontend

jobs:
  # 브랜치 정책 가드 (모든 요청에서 실행, 해당하지 않으면 step만 건너뛴다)
  #   1) main으로 가는 PR은 release/vX.Y.Z 또는 hotfix/vX.Y.Z에서만 받는다.
  #      Prod CD가 다른 원본을 거부하므로, 머지 전에 PR 단계에서 먼저 막는다.
  #   2) hotfix는 main에서 만든 브랜치여야 한다. develop에만 있는(아직 출시되지 않은) 커밋이 섞이면 실패한다.
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      INTEGRATION_BRANCH: develop
      IS_HOTFIX: ${{ startsWith(github.ref_name, 'hotfix/') || startsWith(github.head_ref, 'hotfix/') }}

    steps:
      - name: Check main PR source branch
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$HEAD_REF" =~ ^(release|hotfix)/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=main PR 원본 브랜치 오류::main은 release/vX.Y.Z 또는 hotfix/vX.Y.Z에서만 머지한다 (현재: ${HEAD_REF})"
            exit 1
          fi

      # hotfix일 때만 전체 히스토리를 받는다.
      - name: Checkout
        if: env.IS_HOTFIX == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check hotfix branch base
        if: env.IS_HOTFIX == 'true'
        run: |
          set -Eeuo pipefail

          unreleased="$(comm -12 \
            <(git rev-list "origin/main..HEAD" | sort) \
            <(git rev-list "origin/main..origin/${INTEGRATION_BRANCH}" | sort))"

          if [[ -n "$unreleased" ]]; then
            echo "::error title=hotfix 브랜치 기준 오류::${INTEGRATION_BRANCH}에만 있는 커밋이 hotfix에 섞여 있다. main에서 브랜치를 다시 만들고 수정만 cherry-pick한다."
            git log --oneline --no-walk --stdin <<<"$unreleased" | head -20
            exit 1
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit test
        run: pnpm test

  quality:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Chromatic 의 baseline 비교를 위해 전체 히스토리가 필요하다.
          fetch-depth: 0

      # v6 는 부트스트랩 pnpm 을 설치한 뒤 self-update 로 타깃 버전에 맞추는데,
      # 그 과정이 self-installer 단계에서 실패해 v4 를 사용한다.
      # v4 는 요청한 버전을 그대로 설치한다.
      # version 값은 package.json 의 packageManager 와 반드시 일치해야 한다.
      # 두 값이 어긋나면 action 이 "Multiple versions of pnpm specified" 로 실패한다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 빠르고 싼 검증부터 실행해 피드백 시간을 줄인다.
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Run Chromatic
        if: github.event_name == 'push'
        run: pnpm run chromatic --exit-zero-on-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  build:
    name: Build and publish
    needs:
      - branch-policy
      - test
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # develop에서는 Dev 배포용 이미지를, release/vX.Y.Z에서는 Stg 배포용 이미지(rc-*)를,
      # hotfix/vX.Y.Z에서는 Prod 긴급 수정 이미지(hf-*)를 ECR에 Push한다.
      # main과 PR에서는 Dockerfile 검증만 수행하고 ECR에 Push하지 않는다.
      - name: Resolve image tag
        id: meta
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_REF_NAME" == develop ]]; then
            image_tag="dev-${GITHUB_SHA:0:7}"
            release_version=""
            if [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              push_image=true
            else
              push_image=false
            fi
          elif [[ "$GITHUB_REF_NAME" == release/* ]]; then
            version="${GITHUB_REF_NAME#release/}"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            image_tag="rc-${version}-${GITHUB_SHA:0:7}"
            release_version="${version#v}"
            if [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              push_image=true
            else
              push_image=false
            fi
          elif [[ "$GITHUB_REF_NAME" == hotfix/* ]]; then
            # main에서 만든 긴급 수정. Stg를 거치지 않고 Prod CD가 이 digest를 승격한다.
            version="${GITHUB_REF_NAME#hotfix/}"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            image_tag="hf-${version}-${GITHUB_SHA:0:7}"
            release_version="${version#v}"
            if [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              push_image=true
            else
              push_image=false
            fi
          elif [[ "$GITHUB_REF_NAME" == main ]]; then
            image_tag="main-${GITHUB_SHA:0:7}"
            release_version="$(node -p "require('./package.json').version")"
            push_image=false
          else
            image_tag="pr-${GITHUB_SHA:0:7}"
            release_version=""
            push_image=false
          fi

          {
            echo "image_tag=$image_tag"
            echo "release_version=$release_version"
            echo "push_image=$push_image"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # ECR push 대상 빌드(develop·release/*·hotfix/*)만 AWS에 인증한다.
      # CI Role 신뢰 정책이 브랜치 ref만 허용하므로 PR 이벤트는 인증할 수 없다.
      - name: Configure AWS credentials
        if: steps.meta.outputs.push_image == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: fe-ci-${{ github.run_id }}

      # 배포될 이미지는 SSM 값으로만 빌드한다. 키가 없거나 CHANGE_ME면 여기서 실패한다
      # (V1처럼 빈 값·기본값으로 빌드가 성공해 버리는 것을 막는다).
      - name: Load build env from SSM
        if: steps.meta.outputs.push_image == 'true'
        run: |
          set -Eeuo pipefail

          required=(
            NEXT_PUBLIC_API_BASE_URL
            NEXT_PUBLIC_KAKAO_MAP_APP_KEY
            NEXT_PUBLIC_SENTRY_DSN
            NEXT_PUBLIC_SENTRY_ENVIRONMENT
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE
            NEXT_PUBLIC_FIREBASE_API_KEY
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
            NEXT_PUBLIC_FIREBASE_PROJECT_ID
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
            NEXT_PUBLIC_FIREBASE_APP_ID
            NEXT_PUBLIC_FIREBASE_MESSAGING_VAPID_KEY
          )
          # SSM은 빈 값을 저장할 수 없다. 선택값은 파라미터가 없으면 빈 값으로 빌드한다.
          optional=(
            NEXT_PUBLIC_GA_ID
            NEXT_PUBLIC_CLARITY_PROJECT_ID
          )

          # GetParameters는 한 번에 최대 10개까지만 받으므로 10개씩 나눠 조회하고 결과를 합친다.
          names=("${required[@]/#/${SSM_BUILD_PREFIX}/}" "${optional[@]/#/${SSM_BUILD_PREFIX}/}")
          chunks=()
          for ((i = 0; i < ${#names[@]}; i += 10)); do
            chunks+=("$(aws ssm get-parameters --with-decryption \
              --names "${names[@]:i:10}" \
              --output json)")
          done
          out="$(printf '%s\n' "${chunks[@]}" | jq -s '{Parameters: (map(.Parameters) | add), InvalidParameters: (map(.InvalidParameters) | add)}')"

          missing=()
          for key in "${required[@]}"; do
            if jq -e --arg n "${SSM_BUILD_PREFIX}/${key}" '.InvalidParameters | index($n)' <<<"$out" >/dev/null; then
              missing+=("$key")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=SSM 빌드 파라미터 없음::${SSM_BUILD_PREFIX}/ 아래에 ${missing[*]} 가 없다. CLOUD 레포 v2/ssm.tf 확인"
            exit 1
          fi

          for key in "${optional[@]}"; do
            echo "${key}=" >> "$GITHUB_ENV"   # 아래에서 값이 있으면 덮어쓴다
          done

          placeholders=()
          while IFS=$'\t' read -r name value; do
            key="${name##*/}"
            if [[ "$value" == CHANGE_ME ]]; then
              placeholders+=("$key")
              continue
            fi
            echo "${key}=${value}" >> "$GITHUB_ENV"
            echo "loaded: ${key}"
          done < <(jq -r '.Parameters[] | [.Name, .Value] | @tsv' <<<"$out")

          if (( ${#placeholders[@]} > 0 )); then
            echo "::error title=SSM 빌드 파라미터 미입력::${placeholders[*]} 가 CHANGE_ME다. 콘솔 Parameter Store에서 ${SSM_BUILD_PREFIX}/<KEY> 값을 입력"
            exit 1
          fi

      # PR·main 빌드는 Dockerfile·빌드 검증만 하고 이미지를 push하지 않는다.
      # 배포되지 않는 이미지이므로 실제 값 대신 명시적인 더미 값을 쓴다.
      - name: Use placeholder build env
        if: steps.meta.outputs.push_image != 'true'
        run: |
          {
            echo "NEXT_PUBLIC_API_BASE_URL=/api"
            echo "NEXT_PUBLIC_KAKAO_MAP_APP_KEY=ci-placeholder"
            echo "NEXT_PUBLIC_GA_ID="
            echo "NEXT_PUBLIC_CLARITY_PROJECT_ID="
            echo "NEXT_PUBLIC_SENTRY_DSN="
            echo "NEXT_PUBLIC_SENTRY_ENVIRONMENT=ci"
            echo "NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=0"
            echo "NEXT_PUBLIC_FIREBASE_API_KEY=ci-placeholder"
            echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-placeholder.firebaseapp.com"
            echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-placeholder"
            echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=0"
            echo "NEXT_PUBLIC_FIREBASE_APP_ID=ci-placeholder"
            echo "NEXT_PUBLIC_FIREBASE_MESSAGING_VAPID_KEY=ci-placeholder"
          } >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          set -Eeuo pipefail

          docker_build_args=()
          if [[ -n "${SENTRY_AUTH_TOKEN:-}" ]]; then
            docker_build_args+=(--secret "id=sentry_auth_token,env=SENTRY_AUTH_TOKEN")
          fi

          DOCKER_BUILDKIT=1 docker build \
            --file Dockerfile \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --build-arg "BUILD_SHA=${GITHUB_SHA}" \
            --build-arg "RELEASE_VERSION=${{ steps.meta.outputs.release_version }}" \
            --build-arg "BUILD_DATE=${{ steps.meta.outputs.build_date }}" \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}" \
            --build-arg "NEXT_PUBLIC_KAKAO_MAP_APP_KEY=${NEXT_PUBLIC_KAKAO_MAP_APP_KEY}" \
            --build-arg "NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}" \
            --build-arg "NEXT_PUBLIC_CLARITY_PROJECT_ID=${NEXT_PUBLIC_CLARITY_PROJECT_ID}" \
            --build-arg "NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}" \
            --build-arg "NEXT_PUBLIC_SENTRY_ENVIRONMENT=${NEXT_PUBLIC_SENTRY_ENVIRONMENT}" \
            --build-arg "NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_MESSAGING_VAPID_KEY=${NEXT_PUBLIC_FIREBASE_MESSAGING_VAPID_KEY}" \
            --build-arg "SENTRY_ORG=${SENTRY_ORG:-}" \
            --build-arg "SENTRY_PROJECT=${SENTRY_PROJECT:-}" \
            "${docker_build_args[@]}" \
            .
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        shell: bash

      - name: Login to ECR
        if: steps.meta.outputs.push_image == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        if: steps.meta.outputs.push_image == 'true'
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -Eeuo pipefail

          remote_image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "$remote_image"
          docker push "$remote_image"

      - name: Resolve image digest and create release manifest
        if: steps.meta.outputs.push_image == 'true'
        id: release
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
        run: |
          set -Eeuo pipefail

          image_digest="$({
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          })"

          [[ "$image_digest" == sha256:* ]]

          mkdir -p release-manifest
          jq -n \
            --arg source_branch "$GITHUB_REF_NAME" \
            --arg source_sha "$GITHUB_SHA" \
            --arg image_tag "$IMAGE_TAG" \
            --arg image_digest "$image_digest" \
            --arg release_version "$RELEASE_VERSION" \
            --arg ecr_repository "$ECR_REPOSITORY" \
            '{
              source_branch: $source_branch,
              source_sha: $source_sha,
              image_tag: $image_tag,
              image_digest: $image_digest,
              release_version: $release_version,
              ecr_repository: $ecr_repository
            }' > release-manifest/release-manifest.json

          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Upload release manifest
        if: steps.meta.outputs.push_image == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest/release-manifest.json
          retention-days: 14
