name: FE V3 Stg CD

# 이미지 digest를 CLOUD 저장소 v3/helm/app-values/stg에 커밋해 EKS에 배포한다.
# release/vX.Y.Z CI가 만든 rc digest를 반영하고, Argo CD 배포가 끝나면 stg- 태그를 남긴다.

on:
  workflow_run:
    workflows:
      - FE CI
    types:
      - completed
    branches:
      - 'release/**'

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: frontend-v3-cd-stg
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EKS (stg)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: staging
      url: https://stg.moyeota.com
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release-manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve release candidate image
        id: release
        run: |
          set -Eeuo pipefail

          manifest="release-manifest/release-manifest.json"
          source_branch="$(jq -r '.source_branch' "$manifest")"
          image_tag="$(jq -r '.image_tag' "$manifest")"
          image_digest="$(jq -r '.image_digest' "$manifest")"

          version="${source_branch#release/}"
          [[ "$source_branch" == release/* ]]
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$image_tag" == rc-${version}-* ]]
          [[ "$image_digest" == sha256:* ]]

          {
            echo "image_ref=${ECR_REGISTRY}/${ECR_REPOSITORY}@${image_digest}"
            echo "image_digest=$image_digest"
            echo "image_tag=$image_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitOps token
        id: gitops-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: KTB4-3rd-CLOUD

      - name: Checkout deploy action
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Deploy with Argo CD
        uses: ./.github/actions/gitops-deploy
        with:
          stage: stg
          app: fe
          image-digest: ${{ steps.release.outputs.image_digest }}
          release-id: ${{ steps.release.outputs.image_tag }}
          applications: stg-frontend
          token: ${{ steps.gitops-token.outputs.token }}
          timeout-minutes: '40'

  # Deploy Role은 ECR 권한이 없으므로(검증된 digest를 서비스에 반영만 함) 태그 기록은 CI Role로 한다.
  # environment가 없는 job이라 OIDC sub는 기본 브랜치 ref 기준이 된다.
  mark-stg-verified:
    name: Tag Stg-verified image
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release-manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: frontend-stg-mark-${{ github.run_id }}

      - name: Tag image as Stg-verified without rebuilding
        run: |
          set -Eeuo pipefail

          manifest="release-manifest/release-manifest.json"
          source_branch="$(jq -r '.source_branch' "$manifest")"
          source_sha="$(jq -r '.source_sha' "$manifest")"
          image_digest="$(jq -r '.image_digest' "$manifest")"

          version="${source_branch#release/}"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$image_digest" == sha256:* ]]

          stg_tag="stg-${version}-${source_sha:0:7}"

          if existing_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$stg_tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null)"; then
            if [[ "$existing_digest" != "$image_digest" ]]; then
              echo "ECR tag collision: ${stg_tag}" >&2
              echo "Expected digest: ${image_digest}" >&2
              echo "Existing digest: ${existing_digest}" >&2
              exit 1
            fi

            echo "ECR tag already points to the expected digest: ${stg_tag}"
            exit 0
          fi

          image_manifest="$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageDigest="$image_digest" \
            --query 'images[0].imageManifest' \
            --output text)"

          test -n "$image_manifest"
          test "$image_manifest" != None

          aws ecr put-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-tag "$stg_tag" \
            --image-manifest "$image_manifest" >/dev/null

          tagged_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$stg_tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          test "$tagged_digest" = "$image_digest"
          echo "Tagged ${image_digest} as ${stg_tag}"
