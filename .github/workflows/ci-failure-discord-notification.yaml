name: CI Failure Notification

on:
  workflow_run:
    workflows:
      - FE CI
    types:
      - completed

permissions:
  actions: read

jobs:
  notify:
    name: Discord notification
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Build CI failure embed
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              },
            );

            const failedConclusions = new Set([
              'failure',
              'timed_out',
              'cancelled',
              'action_required',
            ]);
            const failedJobs = jobs.filter((job) =>
              failedConclusions.has(job.conclusion),
            );
            const conclusionLabels = {
              failure: '실패',
              timed_out: '시간 초과',
              cancelled: '취소됨',
              action_required: '조치 필요',
            };

            const failedJobDetails = failedJobs.map((job) => {
              const failedSteps = (job.steps ?? [])
                .filter((step) => failedConclusions.has(step.conclusion))
                .map((step) => step.name);
              const conclusion = conclusionLabels[job.conclusion] || job.conclusion;
              const steps = failedSteps.length
                ? `\n실패 step: ${failedSteps.join(', ')}`
                : '';

              return `${job.name} (${conclusion})${steps}\n${job.html_url}`;
            });

            const failedJobsField = failedJobDetails.length
              ? failedJobDetails.join('\n\n')
              : '실패한 job 정보를 조회하지 못했습니다.';

            const embeds = [
              {
                title: `❌ CI 실패 알림\n${run.name}`,
                color: 15158332,
                description: run.html_url,
                fields: [
                  {
                    name: 'Failed jobs',
                    value: failedJobsField.slice(0, 1024),
                  },
                  {
                    name: 'Branch',
                    value: run.head_branch || '-',
                    inline: true,
                  },
                  {
                    name: 'Event',
                    value: run.event || '-',
                    inline: true,
                  },
                  {
                    name: 'Actor',
                    value: run.actor?.login || '-',
                    inline: true,
                  },
                  {
                    name: 'Commit',
                    value: run.head_sha ? run.head_sha.slice(0, 7) : '-',
                    inline: true,
                  },
                ],
              },
            ];

            core.exportVariable('DISCORD_EMBEDS', JSON.stringify(embeds));

      - name: Send CI failure notification
        uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USERNAME: WAPP_BOT
          DISCORD_AVATAR: https://github.com/pknu-wap/WAPP/blob/main/image/icon.png?raw=true
